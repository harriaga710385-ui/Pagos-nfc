<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Datos para pago - Héctor Arriaga Díaz</title>
<style>
  :root {
    box-sizing: border-box;
    --bg: #eef4fb; --card: #ffffff; --brand: #0b3d91; --text: #14213d; --muted: #4a5a75;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1626; --card: #13233b; --brand: #1e5fd0; --text: #eaf2ff; --muted: #9fb3cf;
    }
  }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.3;
    user-select: none; -webkit-user-select: none;
  }
  .banner { display: block; width: 100%; height: auto; }
  main { max-width: 560px; margin: 0 auto; padding: 10px; }
  .card { background: var(--card); border-radius: 10px; padding: 9px 12px; margin-bottom: 7px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .label { font-size: 11px; color: var(--muted); margin: 0; }
  .value { font-size: 15px; font-weight: 700; margin: 0; }
  .clabe { font-size: 18px; font-weight: 700; letter-spacing: 1px; word-break: break-all; margin: 2px 0 0; user-select: text; -webkit-user-select: text; }
  button, .btn-link {
    display: block; box-sizing: border-box; width: 100%; margin-top: 6px; padding: 9px; font-size: 14px; font-weight: 700;
    border: none; border-radius: 9px; background: var(--brand); color: #fff; cursor: pointer; text-align: center; text-decoration: none;
  }
  button:active { opacity: .85; }
  .secondary { background: #25a244; }
  .msg { text-align: center; color: #2e7d32; font-size: 12px; min-height: 16px; margin: 4px 0 0; }
  .note { text-align: center; color: var(--muted); font-size: 11px; margin: 4px 0 0; }
  #overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 10;
    flex-direction: column; align-items: center; justify-content: center; padding: 12px; box-sizing: border-box;
  }
  #overlay.show { display: flex; }
  #posterImg { max-width: 100%; max-height: 74vh; border-radius: 12px; user-select: auto; -webkit-user-select: auto; -webkit-touch-callout: default; }
  #overlay > p, #overlay > button, #overlay > a { max-width: 320px; width: 100%; box-sizing: border-box; }
  #btnCerrar { background: #555; }
</style>
</head>

<script>
  const msgCopiar = document.getElementById('msgCopiar');
  document.getElementById('btnCopiar').addEventListener('click', async () => {
    const clabe = document.getElementById('clabe').textContent.trim();
    try {
      await navigator.clipboard.writeText(clabe);
      msgCopiar.textContent = '¡CLABE copiada!';
    } catch (e) {
      const range = document.createRange();
      range.selectNodeContents(document.getElementById('clabe'));
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
      msgCopiar.textContent = 'Mantén presionada la CLABE para copiarla';
    }
  });

  function drawPoster(bannerImg) {
    const W = 1080, H = 1500;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#eef4fb'; ctx.fillRect(0, 0, W, H);
    const bh = Math.round(W * bannerImg.naturalHeight / bannerImg.naturalWidth);
    ctx.drawImage(bannerImg, 0, 0, W, bh);
    const centerText = (t, y, font, color) => {
      ctx.font = font; ctx.fillStyle = color; ctx.textAlign = 'center';
      ctx.fillText(t, W/2, y);
    };
    let y = bh + 150;
    centerText('DATOS PARA PAGO', y, 'bold 80px Arial', '#0b3d91');
    y += 130;
    const rows = [
      ['Nombre', 'Héctor Arriaga Díaz'],
      ['Banco', 'BBVA'],
      ['CLABE interbancaria', '012 180 015424380461'],
      ['Comprobante por WhatsApp', '+52 962 383 3335']
    ];
    rows.forEach(([label, value]) => {
      centerText(label, y, '40px Arial', '#4a5a75');
      centerText(value, y + 75, 'bold 58px Arial', '#14213d');
      y += 185;
    });
    return c;
  }

  let posterBlob = null;
  document.getElementById('btnGuardar').addEventListener('click', () => {
    const canvas = drawPoster(document.querySelector('.banner'));
    canvas.toBlob((blob) => {
      posterBlob = blob;
      const url = URL.createObjectURL(blob);
      document.getElementById('posterImg').src = url;
      document.getElementById('btnDescargar').href = url;
      document.getElementById('overlay').classList.add('show');
    }, 'image/png');
  });
  document.getElementById('btnCerrar').addEventListener('click', () => {
    document.getElementById('overlay').classList.remove('show');
  });
  document.getElementById('btnCompartir').addEventListener('click', async () => {
    if (!posterBlob) return;
    const file = new File([posterBlob], 'datos_pago_hector.png', { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Datos para pago' });
      } else {
        alert('Tu navegador no permite compartir. Usa Descargar imagen.');
      }
    } catch (err) { /* el usuario canceló */ }
  });
</script>
</body>
